[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "equicafi"
version = "0.1.0"
description = "EQUICAFI — Equity Intelligence Engine"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.7",
  "typer>=0.12",
  "yfinance>=0.2.40",
  "plotly>=5.24",
  "streamlit>=1.40",
  "pytest>=8.0",
]

[project.scripts]
equicafi = "equicafi.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["equicafi*"]
